<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>어느 쪽이 셀까? — 포커 첫걸음</title>
<meta name="description" content="카드 한 장부터 시작하는 포커 입문 게임">
<meta name="theme-color" content="#211533">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23211533'/%3E%3Crect x='45' y='34' width='90' height='112' rx='14' fill='%23FBF6EA'/%3E%3Ctext x='90' y='112' font-size='68' text-anchor='middle' fill='%231B1526' font-family='serif'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500&display=swap');

:root{
  --bg:#211533; --bg-2:#2E1D46; --panel:#382356; --edge:#4B3070;
  --paper:#FBF6EA; --ink:#1B1526; --red:#D2453C;
  --text:#EDE4F7; --mute:#A793C0; --go:#35D39A; --no:#FF6B6B; --amber:#FFC145;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --disp:'Do Hyeon','Apple SD Gothic Neo',system-ui,sans-serif;
  --serif:'Gowun Batang',Georgia,serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(130% 70% at 50% -10%,#3A2359 0%,var(--bg) 55%) fixed,var(--bg);
  color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:8px}
h1,h2,strong,.btn,.opt{font-family:var(--disp);font-weight:400}
.screen{padding:20px 18px 40px;max-width:520px;margin:0 auto;position:relative;}

/* 카드 */
.card{--w:60px;width:var(--w);height:calc(var(--w)*1.45);background:var(--paper);border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--serif);line-height:1;box-shadow:0 4px 0 rgba(0,0,0,.28);flex:0 0 auto;}
.card-lg{--w:94px}.card-md{--w:60px}.card-sm{--w:44px}
.card b{font-size:calc(var(--w)*.42);font-weight:700}
.card i{font-size:calc(var(--w)*.32);font-style:normal;margin-top:2px}
.card.red{color:var(--red)}.card.blk{color:var(--ink)}
.card.win{transform:translateY(-6px) scale(1.04);box-shadow:0 4px 0 rgba(0,0,0,.28),0 0 0 3px var(--go)}
.card.fade{opacity:.36}
.hand{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}

/* 코스 */
.hero{text-align:center;padding:20px 0 22px}
.hero-cards{display:flex;justify-content:center;margin-bottom:16px}
.hero-cards .card:nth-child(1){transform:rotate(-13deg) translateX(12px)}
.hero-cards .card:nth-child(2){transform:translateY(-6px);z-index:2}
.hero-cards .card:nth-child(3){transform:rotate(13deg) translateX(-12px)}
.hero h1{font-size:30px;margin:0 0 8px;color:#FFF}
.hero p{margin:0;color:var(--mute);font-size:14px}
.ch{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  margin:22px 0 10px;padding:12px 14px;border-radius:12px;
  background:var(--bg-2);border:1.5px solid var(--edge);color:var(--text)}
.ch.on{border-color:var(--amber);background:var(--panel)}
.ch-txt{flex:1;display:flex;flex-direction:column;min-width:0}
.ch-txt strong{font-size:16px;color:#FFF}
.ch-txt small{font-size:12px;color:var(--mute)}
.ch-cnt{font-family:var(--disp);font-size:13px;color:var(--amber);flex:0 0 auto}
.ch-arw{flex:0 0 auto;color:var(--mute);font-size:12px;width:14px;text-align:center}
.skip{margin-left:auto;font-family:var(--sans);font-size:12px;color:var(--mute);
  border:1px solid var(--edge);border-radius:99px;padding:4px 10px}
.track{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;margin-bottom:4px}
.card.back{background:repeating-linear-gradient(45deg,#3A2359 0 5px,#2E1D46 5px 10px);
  border:1px solid var(--edge);box-shadow:none}

/* ── 실전 대결 테이블 ── */
.node.duel .node-no{background:var(--go);color:#062A1D}
.hand-no{flex:1;text-align:center;font-family:var(--disp);font-size:14px;color:var(--mute)}
.felt{padding-bottom:24px}
.seat{background:var(--bg-2);border:1.5px solid var(--edge);border-radius:14px;
  padding:12px 14px;margin-bottom:10px;position:relative}
.seat-line{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.seat-line strong{font-size:15px;color:#FFF}
.chips{font-family:var(--disp);font-size:16px;color:var(--amber)}
.betchip{position:absolute;right:12px;bottom:12px;font-family:var(--disp);font-size:12px;
  background:var(--panel);border:1px solid var(--edge);border-radius:99px;padding:3px 10px;color:var(--text)}
.myhand{display:block;margin-top:10px;font-size:12.5px;color:var(--mute)}
.board{background:var(--panel);border:1.5px solid var(--edge);border-radius:14px;
  padding:14px 10px;margin-bottom:10px;text-align:center}
.potlbl{display:block;font-size:12px;color:var(--mute);margin-bottom:10px;letter-spacing:.08em}
.potlbl b{font-family:var(--disp);font-size:17px;color:var(--amber);margin-left:4px}
.tlog{display:flex;flex-direction:column;gap:2px;margin:12px 0;font-size:12.5px;color:var(--mute);min-height:52px}
.tmsg{padding:11px 13px;border-radius:11px;background:var(--panel);border-left:3px solid var(--edge);
  font-size:13.5px;margin-bottom:12px}
.tmsg.good{border-color:var(--go)}
.tmsg.bad{border-color:var(--no)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.act{flex:1 1 30%;min-width:96px;padding:14px 6px;border-radius:12px;
  border:2px solid var(--edge);background:var(--bg-2);font-family:var(--disp);font-size:15px}
.act.hot{border-color:var(--amber);color:var(--amber)}
.waiting{color:var(--mute);font-size:13.5px;padding:12px 2px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.two .opt{padding:18px 8px;font-size:17px}
.node button{width:100%;display:flex;align-items:center;gap:13px;text-align:left;
  background:var(--bg-2);border:1.5px solid var(--edge);border-radius:14px;padding:12px 14px;}

.node.lock button{opacity:.4}
.node-no{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:var(--panel);color:var(--mute);font-family:var(--disp);font-size:15px}
.node.open .node-no{background:var(--amber);color:#2A1B06}
.node.done .node-no{background:var(--go);color:#062A1D}
.node-txt{display:flex;flex-direction:column;min-width:0}
.node-txt strong{font-size:16px;color:#FFF}
.node-txt small{font-size:12.5px;color:var(--mute);line-height:1.5}
.node.focus>button{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,193,69,.18)}

.node.speed{margin-top:18px}
.node.speed button{border-style:dashed}
.node.speed.open .node-no{background:#FF7A45;color:#2B0E03}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:22px;
  font-size:12.5px;color:var(--mute)}
.meta button{font-size:12.5px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.install{display:block;width:100%;margin-top:16px;padding:13px;border-radius:12px;
  border:2px solid var(--amber);color:var(--amber);font-family:var(--disp);font-size:15px}

/* 소개 */
.intro{padding-top:28px}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--amber)}
.intro h2{font-size:27px;margin:6px 0 12px;color:#FFF}
.rule{font-size:16px;line-height:1.75;margin:0 0 24px}
.demo{background:var(--bg-2);border:1.5px solid var(--edge);border-radius:16px;
  padding:22px 14px;text-align:center;margin-bottom:24px}
.demo span{display:block;margin-top:14px;font-size:13.5px;color:var(--mute)}

/* 문제 */
.hud{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.x{font-size:19px;color:var(--mute);padding:4px 8px;line-height:1}
.x.solo{position:absolute;right:14px;top:16px}
.bar{flex:1;height:7px;background:var(--panel);border-radius:99px;overflow:hidden}
.bar-in{display:block;height:100%;background:var(--amber);border-radius:99px;}
.timer{flex:1;text-align:center;font-family:var(--disp);font-size:18px}
.timer.hot{color:var(--no)}
.streak{font-family:var(--disp);font-size:15px;color:var(--mute);min-width:48px;text-align:right}
.streak.hot{color:var(--amber)}
.ask{text-align:center;font-family:var(--disp);font-size:20px;color:#FFF;margin:0 0 18px}
.arena.duel{display:flex;align-items:center;justify-content:center;gap:8px}
.arena.stack{display:flex;flex-direction:column;gap:9px}
.side{background:var(--bg-2);border:2px solid var(--edge);border-radius:16px;padding:16px 10px;
  flex:1 1 0;min-width:0;}
.arena.duel .side{display:grid;place-items:center}

.side.win{border-color:var(--go);background:rgba(53,211,154,.13)}
.side.bad{border-color:var(--no);background:rgba(255,107,107,.1);}
.side.fade{opacity:.45}
.side-name{display:block;margin-top:9px;font-family:var(--disp);font-size:14px}
.vs{font-family:var(--disp);font-size:13px;color:var(--mute);letter-spacing:.1em;text-align:center}
.arena.stack .vs{padding:1px 0}
.tie-btn{display:block;width:100%;margin-top:11px;padding:12px;border:2px dashed var(--edge);
  border-radius:14px;color:var(--mute);font-family:var(--disp);font-size:15px}
.tie-btn.win{border-style:solid;border-color:var(--go);color:var(--go)}
.tie-btn.bad{border-style:solid;border-color:var(--no);color:var(--no);}
.tie-btn.fade{opacity:.4}
.showcase{background:var(--bg-2);border:1.5px solid var(--edge);border-radius:16px;
  padding:18px 12px;text-align:center;margin-bottom:18px}
.lbl{display:block;font-size:11px;letter-spacing:.14em;color:var(--mute);margin-bottom:9px}
.lbl.mt{margin-top:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt{padding:15px 8px;background:var(--bg-2);border:2px solid var(--edge);border-radius:14px;
  font-size:16px;}
.opt.win{border-color:var(--go);background:rgba(53,211,154,.14);color:#FFF}
.opt.bad{border-color:var(--no);background:rgba(255,107,107,.1);}
.opt.fade{opacity:.4}
.feedback{margin-top:20px;padding:16px;border-radius:14px;background:var(--panel);
  border-left:4px solid var(--no);}
.feedback strong{display:block;font-size:17px;color:#FFF;margin-bottom:4px}
.feedback p{margin:0 0 14px;font-size:14px}

/* 결과 */
.result{text-align:center;padding-top:52px}
.result-mark{font-size:52px;color:var(--amber);line-height:1}
.result h2{font-size:26px;margin:14px 0 6px;color:#FFF}
.big-score{font-family:var(--disp);font-size:20px;color:var(--mute);margin:8px 0 2px}
.big-score span{font-size:46px;color:var(--go)}
.result.perfect .big-score span{color:var(--amber)}
.result.perfect .result-mark{text-shadow:0 0 22px rgba(255,193,69,.45)}
.sub{color:var(--mute);font-size:13.5px;margin:2px 0}
.sub.warn{color:var(--amber);margin-top:12px}

/* 버튼 */
.btn{padding:14px 20px;border-radius:12px;background:var(--amber);color:#2A1B06;font-size:16px;
  box-shadow:0 4px 0 #C89224;}

.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--edge);box-shadow:none}
.btn.wide{display:block;width:100%}
.btn-row{display:flex;gap:10px;margin-top:28px}
.btn-row .btn{flex:1}

/* 승부를 가른 카드 — 금색 파문이 퍼졌다 자리잡는다 */

.card.key{box-shadow:0 4px 0 rgba(0,0,0,.28),0 0 0 3px var(--amber);transform:translateY(-4px);opacity:1;}

</style>

<script>
"use strict";

/* ═══════════  저장소 (아티팩트 미리보기에서도 안 터지게 방어)  ═══════════ */
var store = (function () {
  var mem = {};
  try {
    localStorage.setItem("__t", "1"); localStorage.removeItem("__t");
    return {
      get: function (k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } },
      set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
    };
  } catch (e) {
    return { get: function (k) { return mem[k] || null; }, set: function (k, v) { mem[k] = v; } };
  }
})();

/* ═══════════  카드 기본  ═══════════ */
var SUITS = ["s", "h", "d", "c"];
var SUIT_CHAR = { s: "♠", h: "♥", d: "♦", c: "♣" };
var SUIT_KO = { s: "스페이드", h: "하트", d: "다이아", c: "클로버" };
var LABEL = { 14:"A",13:"K",12:"Q",11:"J",10:"10",9:"9",8:"8",7:"7",6:"6",5:"5",4:"4",3:"3",2:"2" };
var SPOKEN = { 14:"A(에이스)",13:"K(킹)",12:"Q(퀸)",11:"J(잭)" };
function say(r){ return SPOKEN[r] || LABEL[r]; }

function rnd(n){ return Math.floor(Math.random()*n); }
function pick(a){ return a[rnd(a.length)]; }
function shuffle(a){ var x=a.slice(),i,j,t; for(i=x.length-1;i>0;i--){ j=rnd(i+1); t=x[i]; x[i]=x[j]; x[j]=t; } return x; }
function cid(c){ return c.r + c.s; }

function draw(rank, used){
  var ss = shuffle(SUITS), i, k;
  for(i=0;i<ss.length;i++){ k = rank+ss[i]; if(!used.has(k)){ used.add(k); return {r:rank,s:ss[i]}; } }
  return { r:rank, s:pick(SUITS) };
}

/* ═══════════  손 평가  ═══════════ */
function score(hand){
  var rs = hand.map(function(c){return c.r;}).sort(function(a,b){return b-a;});
  var cnt = {}; rs.forEach(function(r){ cnt[r]=(cnt[r]||0)+1; });
  var groups = Object.keys(cnt).map(function(r){ return [cnt[r], Number(r)]; })
    .sort(function(a,b){ return b[0]-a[0] || b[1]-a[1]; });
  var shape = groups.map(function(g){return g[0];}).join("");
  var kick = groups.map(function(g){return g[1];});

  if(hand.length < 5){
    var flat=[0]; groups.forEach(function(g){ flat.push(g[0],g[1]); }); return flat;
  }
  var flush = hand.every(function(c){ return c.s === hand[0].s; });
  var uniq = rs.filter(function(v,i,a){ return a.indexOf(v)===i; });
  var straight=false, sHigh=0;
  if(uniq.length===5){
    if(uniq[0]-uniq[4]===4){ straight=true; sHigh=uniq[0]; }
    else if(uniq[0]===14 && uniq[1]===5){ straight=true; sHigh=5; }
  }
  if(straight && flush) return [sHigh===14?9:8, sHigh];
  if(shape==="41") return [7].concat(kick);
  if(shape==="32") return [6].concat(kick);
  if(flush) return [5].concat(rs);
  if(straight) return [4, sHigh];
  if(shape==="311") return [3].concat(kick);
  if(shape==="221") return [2].concat(kick);
  if(shape==="2111") return [1].concat(kick);
  return [0].concat(rs);
}
function cmp(a,b){
  var x=score(a), y=score(b), i, d;
  for(i=0;i<Math.max(x.length,y.length);i++){ d=(x[i]||0)-(y[i]||0); if(d) return d>0?1:-1; }
  return 0;
}
var GRADE = ["하이카드","원페어","투페어","트리플","스트레이트","플러시","풀하우스","포카드","스트레이트 플러시","로열 플러시"];
function gradeOf(h){ return score(h)[0]; }
function smallName(hand){
  var g = score(hand).slice(1);
  if(g[0]===3) return "트리플";
  if(g[0]===2 && g[2]===2) return "투페어";
  if(g[0]===2) return "원페어";
  return "하이카드";
}
function nameOf(h){ return h.length<5 ? smallName(h) : GRADE[gradeOf(h)]; }

function bestOfSeven(cards){
  var best=null, n=cards.length, a,b,c,d,e,h;
  for(a=0;a<n-4;a++) for(b=a+1;b<n-3;b++) for(c=b+1;c<n-2;c++) for(d=c+1;d<n-1;d++) for(e=d+1;e<n;e++){
    h=[cards[a],cards[b],cards[c],cards[d],cards[e]];
    if(!best || cmp(h,best)>0) best=h;
  }
  return best;
}

/* ═══════════  왜 이겼는지 설명하기  ═══════════ */

function txt(c){ return LABEL[c.r]+SUIT_CHAR[c.s]; }
/* 받침이 있으면 앞쪽 조사, 없으면 뒤쪽 조사 — "트리플이" / "플러시가" */
function josa(word, withB, withoutB){
  var ch = word.charCodeAt(word.length-1);
  var has = (ch>=0xAC00 && ch<=0xD7A3) ? ((ch-0xAC00)%28)!==0 : false;
  return word + (has ? withB : withoutB);
}
function idsOfRank(hand, r){
  var out=[]; hand.forEach(function(c){ if(c.r===r) out.push(cid(c)); }); return out;
}
/* 그 손에서 '모양을 이루는' 카드들 */
function keyOf(hand){
  var s=score(hand), g=s[0], set=new Set(), i;
  function add(r){ idsOfRank(hand,r).forEach(function(x){ set.add(x); }); }
  if(hand.length<5){
    var gg=s.slice(1);
    if(gg[0]>=2){ add(gg[1]); if(gg[0]===2&&gg[2]===2) add(gg[3]); }
    else add(Math.max.apply(null, hand.map(function(c){return c.r;})));
    return set;
  }
  if(g===0||g===1||g===3||g===7) add(s[1]);
  else if(g===2){ add(s[1]); add(s[2]); }
  else hand.forEach(function(c){ set.add(cid(c)); });
  return set;
}

var PROC = {
  0:"짝이 하나도 없을 땐 가장 높은 카드부터 한 장씩 차례로 비교합니다.",
  1:"먼저 짝의 숫자를 봅니다. 그것까지 같으면 남은 카드를 큰 것부터 순서대로 비교합니다.",
  2:"높은 쪽 짝을 먼저 보고, 같으면 낮은 쪽 짝, 그다음 남은 한 장을 봅니다.",
  3:"트리플의 숫자를 먼저 보고, 같으면 남은 카드를 큰 것부터 비교합니다.",
  4:"이어지는 다섯 장 중 가장 높은 카드로 정합니다.",
  5:"무늬가 같은 건 서로 마찬가지라, 가장 높은 카드부터 한 장씩 비교합니다.",
  6:"세 장 쪽 숫자를 먼저 비교합니다. 두 장 쪽은 그다음입니다.",
  7:"네 장의 숫자로 정합니다.",
  8:"이어지는 다섯 장 중 가장 높은 카드로 정합니다.",
  9:""
};
var POS = {
  1:{1:"짝의 숫자",2:"남은 카드 중 가장 큰 것",3:"그다음 카드",4:"마지막 카드"},
  2:{1:"높은 쪽 짝",2:"낮은 쪽 짝",3:"남은 한 장"},
  3:{1:"트리플의 숫자",2:"남은 카드 중 큰 것",3:"마지막 카드"},
  4:{1:"가장 높은 카드"},
  6:{1:"세 장 쪽 숫자",2:"두 장 쪽 숫자"},
  7:{1:"네 장의 숫자",2:"남은 한 장"},
  8:{1:"가장 높은 카드"}
};

/* 손의 성격을 통일된 형태로: {g:등급, t:[비교할 숫자들]} */
function profile(hand){
  var sc = score(hand), i, ranks;
  if(hand.length >= 5) return { g:sc[0], t:sc.slice(1) };
  /* 5장 미만은 [0, 개수,숫자, 개수,숫자 …] 형태라 따로 풀어 준다 */
  var g0 = sc[1] >= 3 ? 3 : (sc[1] === 2 ? (sc[3] === 2 ? 2 : 1) : 0);
  ranks = [];
  for(i = 1; i < sc.length; i += 2) ranks.push(sc[i+1]);
  return { g:g0, t:ranks };
}

/* 두 손을 받아 '왜 이겼는지' 문장과 강조할 카드를 돌려줍니다 */
function explain(L,R){
  var pl = profile(L), pr = profile(R);
  var win = cmp(L,R) > 0;
  var W = win ? L : R, Lo = win ? R : L;
  var side = win ? "왼쪽" : "오른쪽";

  /* 모양 자체가 다를 때 */
  if(pl.g !== pr.g){
    return {
      text: "왼쪽은 "+nameOf(L)+", 오른쪽은 "+nameOf(R)+"입니다.\n"+
            josa(nameOf(W),"이","가")+" "+nameOf(Lo)+"보다 세서 "+side+"이 이깁니다.\n"+ORDER_LINE,
      keyL: keyOf(L), keyR: keyOf(R)
    };
  }

  /* 같은 모양 안에서 갈릴 때 — 몇 번째 숫자에서 갈렸는지 찾는다 */
  var x = pl.t, y = pr.t, n = Math.max(x.length, y.length), i = 0, j;
  while(i < n && (x[i]||0) === (y[i]||0)) i++;
  if(i >= n){   /* 완전히 같은 값 (실제로는 나오지 않음) */
    return { text:"둘 다 "+nameOf(L)+"입니다.", keyL:keyOf(L), keyR:keyOf(R) };
  }

  var g = pl.g;
  var head = "둘 다 "+nameOf(L)+"입니다. "+(PROC[g] || "");
  var body;

  if(g === 0 || g === 5){
    var same = [];
    for(j = 0; j < i; j++) same.push(LABEL[x[j]]);
    body = (same.length ? same.join(", ")+"까지는 똑같습니다.\n" : "")+
           "그다음 카드에서 갈립니다 — 왼쪽 "+LABEL[x[i]]+", 오른쪽 "+LABEL[y[i]]+
           " → "+side+"이 이깁니다.";
  } else {
    var pos = (POS[g] && POS[g][i+1]) || "그다음 카드";
    if(g === 1 && i === 1 && L.length <= 3) pos = "남은 한 장";
    /* 조사가 어색해지지 않도록 콜론으로 붙인다 */
    body = pos+" — 왼쪽 "+LABEL[x[i]]+", 오른쪽 "+LABEL[y[i]]+" → "+side+"이 이깁니다.";
    if(i === 0 && (g === 2 || g === 6)) body += "\n뒤쪽 숫자는 볼 필요도 없습니다.";
  }

  return {
    text: head+"\n"+body,
    keyL: new Set(idsOfRank(L, x[i])),
    keyR: new Set(idsOfRank(R, y[i]))
  };
}

/* ═══════════  1장: 짝  ═══════════ */
var NUMS=[2,3,4,5,6,7,8,9,10], FACES=[11,12,13,14], ALL=NUMS.concat(FACES);

function twoDistinct(pool){ var a=pick(pool), b=pick(pool); while(b===a) b=pick(pool); return [a,b]; }
function verdict(L,R){ var v=cmp(L,R); return v>0?"L":v<0?"R":"T"; }
function vsQ(L,R,why,extra){
  var q={ kind:"vs", L:L, R:R, answer:verdict(L,R) };
  if(q.answer==="T"){
    q.why = why; q.keyL=new Set(); q.keyR=new Set();
  } else {
    var e = explain(L,R);
    q.why = why || e.text;      // 초반 단계는 손으로 쓴 설명을, 나머지는 자동 분석을
    q.keyL = e.keyL; q.keyR = e.keyR;
  }
  if(extra) for(var k in extra) q[k]=extra[k];
  return q;
}

function genNumbers(){
  var u=new Set(), p=twoDistinct(NUMS);
  return vsQ([draw(p[0],u)],[draw(p[1],u)],
    say(Math.max(p[0],p[1]))+"가 "+say(Math.min(p[0],p[1]))+"보다 큽니다.");
}
function genFaces(){
  var u=new Set(), a=pick(FACES), b=pick(ALL), t;
  while(b===a) b=pick(ALL);
  if(rnd(2)){ t=a; a=b; b=t; }
  return vsQ([draw(a,u)],[draw(b,u)],
    say(Math.max(a,b))+"가 "+say(Math.min(a,b))+"보다 큽니다. A > K > Q > J > 10 순서입니다.");
}
function genSuits(){
  var u=new Set(), r, p;
  if(rnd(10)<5){
    r=pick(ALL);
    return vsQ([draw(r,u)],[draw(r,u)],"무늬는 세기와 상관없습니다. 둘 다 "+say(r)+"이니 비깁니다.",{tie:true});
  }
  p=twoDistinct(ALL);
  return vsQ([draw(p[0],u)],[draw(p[1],u)], say(Math.max(p[0],p[1]))+"가 더 큽니다. 무늬는 보지 않습니다.",{tie:true});
}
function genPairBeats(){
  var u=new Set(), p=pick([2,3,4,5,6,7]), hi=shuffle(FACES).slice(0,2);
  var pair=[draw(p,u),draw(p,u)], high=[draw(hi[0],u),draw(hi[1],u)], flip=rnd(2)===0;
  return vsQ(flip?pair:high, flip?high:pair,
    say(p)+" 짝이 "+say(hi[0])+"·"+say(hi[1])+"보다 셉니다. 짝은 아무리 높은 낱장보다도 위입니다.");
}
function genPairVsPair(){
  var u=new Set(), p=twoDistinct(ALL);
  return vsQ([draw(p[0],u),draw(p[0],u)],[draw(p[1],u),draw(p[1],u)], null);
}
function genKicker(){
  var u=new Set(), p, k, rest, pr;
  if(rnd(10)<6){
    p=pick(ALL);
    k=twoDistinct(ALL.filter(function(r){return r!==p;}));
    return vsQ([draw(p,u),draw(p,u),draw(k[0],u)],[draw(p,u),draw(p,u),draw(k[1],u)], null);
  }
  pr=twoDistinct(ALL);
  rest=shuffle(ALL.filter(function(r){ return r!==pr[0] && r!==pr[1]; }));
  return vsQ([draw(pr[0],u),draw(pr[0],u),draw(rest[0],u)],[draw(pr[1],u),draw(pr[1],u),draw(rest[1],u)], null);
}
function build4(kind, rs, u){
  if(kind==="trips") return [draw(rs[0],u),draw(rs[0],u),draw(rs[0],u),draw(rs[1],u)];
  if(kind==="two")   return [draw(rs[0],u),draw(rs[0],u),draw(rs[1],u),draw(rs[1],u)];
  if(kind==="pair")  return [draw(rs[0],u),draw(rs[0],u),draw(rs[1],u),draw(rs[2],u)];
  return [draw(rs[0],u),draw(rs[1],u),draw(rs[2],u),draw(rs[3],u)];
}
function genShapes(){
  var u=new Set(), rs=shuffle(ALL), order=["high","pair","two","trips"], ij=twoDistinct([0,1,2,3]);
  var L=build4(order[ij[0]],rs.slice(0,4),u), R=build4(order[ij[1]],rs.slice(4,8),u);
  var q=vsQ(L,R,null);
  q.why = q.why.replace(ORDER_LINE, "트리플 > 투페어 > 원페어 > 하이카드.");
  return q;
}

/* ═══════════  2장: 다섯 장 모양  ═══════════ */
function deck(){ var d=[],r,i; for(r=2;r<=14;r++) for(i=0;i<4;i++) d.push({r:r,s:SUITS[i]}); return d; }

function makeHand(grade, used){
  var t, ranks, hand, s, hi, rs, ids, ok;
  for(t=0;t<400;t++){
    ranks = shuffle(ALL); hand = null;
    if(grade===9){ s=pick(SUITS); hand=[14,13,12,11,10].map(function(r){return {r:r,s:s};}); }
    else if(grade===8){
      s=pick(SUITS); hi=5+rnd(9);
      hand = hi===5 ? [14,5,4,3,2].map(function(r){return {r:r,s:s};})
                    : [0,1,2,3,4].map(function(i){return {r:hi-i,s:s};});
    }
    else if(grade===7){ hand = SUITS.map(function(x){return {r:ranks[0],s:x};}).concat([{r:ranks[1],s:pick(SUITS)}]); }
    else if(grade===6){ hand = shuffle(SUITS).slice(0,3).map(function(x){return {r:ranks[0],s:x};})
        .concat(shuffle(SUITS).slice(0,2).map(function(x){return {r:ranks[1],s:x};})); }
    else if(grade===5){ s=pick(SUITS); hand = shuffle(ranks).slice(0,5).map(function(r){return {r:r,s:s};}); }
    else if(grade===4){
      hi=5+rnd(10);
      rs = hi===5 ? [14,5,4,3,2] : [0,1,2,3,4].map(function(i){return hi-i;});
      hand = rs.map(function(r){return {r:r,s:pick(SUITS)};});
    }
    else if(grade===3){ hand = shuffle(SUITS).slice(0,3).map(function(x){return {r:ranks[0],s:x};})
        .concat([{r:ranks[1],s:pick(SUITS)},{r:ranks[2],s:pick(SUITS)}]); }
    else if(grade===2){ hand = shuffle(SUITS).slice(0,2).map(function(x){return {r:ranks[0],s:x};})
        .concat(shuffle(SUITS).slice(0,2).map(function(x){return {r:ranks[1],s:x};}))
        .concat([{r:ranks[2],s:pick(SUITS)}]); }
    else if(grade===1){ hand = shuffle(SUITS).slice(0,2).map(function(x){return {r:ranks[0],s:x};})
        .concat([1,2,3].map(function(i){return {r:ranks[i],s:pick(SUITS)};})); }
    else { hand = shuffle(ranks).slice(0,5).map(function(r){return {r:r,s:pick(SUITS)};}); }

    ids = hand.map(cid);
    if(new Set(ids).size !== 5) continue;
    ok = true;
    ids.forEach(function(i){ if(used.has(i)) ok=false; });
    if(!ok) continue;
    if(gradeOf(hand) !== grade) continue;
    ids.forEach(function(i){ used.add(i); });
    return hand;
  }
  return null;
}

function detail(hand){
  var s = score(hand);
  switch(s[0]){
    case 1: return say(s[1])+" 짝";
    case 2: return say(s[1])+"·"+say(s[2])+" 투페어";
    case 3: return say(s[1])+" 트리플";
    case 4: case 8: return say(s[1])+"까지 이어짐";
    case 5: return say(s[1])+" 하이";
    case 6: return say(s[1])+" 세 장";
    case 7: return say(s[1])+" 네 장";
    default: return say(s[1])+" 하이";
  }
}

function duel(pool, extraWhy){
  var t, g, u, L, R, w, l, why;
  for(t=0;t<40;t++){
    g = shuffle(pick(pool)); u = new Set();
    L = makeHand(g[0], u); if(!L) continue;
    R = makeHand(g[1], u); if(!R) continue;
    if(cmp(L,R)===0) continue;
    var q = vsQ(L,R,null);
    if(extraWhy) q.why = q.why.replace(ORDER_LINE, extraWhy);
    return q;
  }
  return genShapes();
}

function genStraight(){ return duel([[4,0],[4,1],[4,2],[4,3],[4,4]],"숫자가 연달아 다섯 장이면 트리플보다 셉니다."); }

function options(correct){
  var near=[], g;
  for(g=0;g<=8;g++) if(g!==correct && Math.abs(g-correct)<=3) near.push(g);
  var opts = shuffle([correct].concat(shuffle(near).slice(0,3)));
  return { opts:opts, answer:opts.indexOf(correct) };
}

function genSeven(){

    w:"할 수 없습니다. 앞에 걸린 돈이 있으면 콜·레이즈·폴드 중에서 골라야 합니다.",
    opts:["할 수 없다","할 수 있다","반만 내면 된다","한 번은 봐준다"] },

    opts:["모두 같아진다","한 바퀴 돌면","딜러가 정한다","세 명이 폴드하면"] }
];
var ACT_ALL = ["체크","벳","콜","레이즈","폴드","올인"];

function genAction(){
  var item = pick(ACT_Q);

  if(item.opts){ opts = item.opts.slice(); }
  else {
    var others = shuffle(ACT_ALL.filter(function(x){ return x!==item.a; })).slice(0,3);

function genSeat(){

/* 시작 손 — 확실히 좋은 것과 확실히 나쁜 것만 낸다 */
function goodHole(){
  var t = rnd(4), r, rs, sv;
  if(t===0){ r = 7+rnd(8); sv = shuffle(SUITS); return [{r:r,s:sv[0]},{r:r,s:sv[1]}]; }
  if(t===1){ sv = shuffle(SUITS); return [{r:14,s:sv[0]},{r:pick([13,12]),s:sv[1]}]; }
  if(t===2){ rs = shuffle([10,11,12,13,14]).slice(0,2); sv = pick(SUITS); return [{r:rs[0],s:sv},{r:rs[1],s:sv}]; }
  sv = pick(SUITS); return [{r:14,s:sv},{r:pick([11,10]),s:sv}];
}
function badHole(){
  for(var i=0;i<300;i++){
    var rs = shuffle(ALL), hi = Math.max(rs[0],rs[1]), lo = Math.min(rs[0],rs[1]);
    if(hi===lo || hi===14) continue;
    if(hi-lo < 3) continue;
    if(lo >= 10) continue;
    if(hi >= 13 && lo >= 9) continue;
    var s1 = pick(SUITS), s2 = pick(SUITS.filter(function(x){ return x!==s1; }));
    return [{r:hi,s:s1},{r:lo,s:s2}];
  }
  return [{r:9,s:"s"},{r:3,s:"h"}];
}
function whyGood(h){
  if(h[0].r===h[1].r) return say(h[0].r)+" 페어는 받자마자 이미 모양이 하나 완성된 상태입니다.\n들어갈 만한 손입니다.";
  if(h[0].s===h[1].s) return "무늬가 같고 숫자도 높습니다.\n플러시로 자랄 수도 있고, 그냥 높은 카드로도 이길 수 있습니다.";
  return "높은 카드 두 장입니다.\n짝이 맞으면 상대의 짝보다 높을 가능성이 큽니다. 들어가도 됩니다.";
}
function whyBad(h){
  var hi = Math.max(h[0].r,h[1].r), lo = Math.min(h[0].r,h[1].r);
  return say(hi)+" · "+say(lo)+" — 숫자가 떨어져 있고 무늬도 다릅니다.\n"+
         "스트레이트도 플러시도 기대하기 어렵고, 짝이 맞아도 낮은 짝이라 밀립니다. 접으세요.";
}
function genStartHand(){
  var good = rnd(2)===0;
  var h = good ? goodHole() : badHole();
  var opts = ["들어간다","접는다"];
  return { kind:"quiz", ask:"이 두 장으로 판에 들어갈까요?", hole:h,
    labels:opts, answer: good?0:1, why: good ? whyGood(h) : whyBad(h) };
}

/* 플랍에서 계속할지 — 애매한 상황은 아예 내지 않는다 */
function genFlopCall(){
  for(var t=0;t<300;t++){
    var dk = shuffle(deck());
    var hole = [dk[0],dk[1]], flop = [dk[2],dk[3],dk[4]];
    var five = hole.concat(flop);
    var sc = score(five), g = sc[0];

    var cnt = {}; five.forEach(function(c){ cnt[c.s] = (cnt[c.s]||0)+1; });
    var fd = false; for(var k in cnt) if(cnt[k]===4) fd = true;

    var rs = five.map(function(c){ return c.r; }).filter(function(v,i,a){ return a.indexOf(v)===i; })
      .sort(function(a,b){ return a-b; });
    var sd = false, i;
    for(i=0;i+3<rs.length;i++) if(rs[i+3]-rs[i]===3) sd = true;

    var mine = hole.some(function(c){ return c.r === sc[1]; });

    if(g >= 1 && mine){
      return { kind:"quiz", ask:"플랍이 열렸습니다. 계속 갈까요?", hole:hole, board:flop,
        labels:["계속 간다","접는다"], answer:0,
        why:"지금 "+GRADE[g]+"를 만들었습니다. 내 카드가 보드와 맞았습니다.\n계속 볼 만한 상황입니다." };
    }
    if(g === 0 && fd && !sd){
      return { kind:"quiz", ask:"플랍이 열렸습니다. 계속 갈까요?", hole:hole, board:flop,
        labels:["계속 간다","접는다"], answer:0,
        why:"아직 아무 모양도 없지만 같은 무늬가 벌써 네 장입니다.\n한 장만 더 나오면 플러시가 되니 계속 볼 만합니다." };
    }
    if(g === 0 && !fd && !sd){
      return { kind:"quiz", ask:"플랍이 열렸습니다. 계속 갈까요?", hole:hole, board:flop,
        labels:["계속 간다","접는다"], answer:1,
        why:"보드와 하나도 맞지 않았습니다. 짝도 없고, 같은 무늬 네 장도 없습니다.\n"+
            "여기서 칩을 더 넣는 건 대부분 손해입니다. 접으세요." };
    }
  }
  return genStartHand();
}


/* ═══════════  실전 대결 · 1대1 홀덤  ═══════════ */

var G = null;

function money(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function other(w){ return w==="me" ? "ai" : "me"; }
function potTotal(){ return G.contrib.me + G.contrib.ai; }
function toCall(w){ return Math.max(0, G.bet[other(w)] - G.bet[w]); }
function isAllIn(w){ return G.stack[w] === 0; }
function pushLog(t){ G.log.push(t); if(G.log.length > 4) G.log.shift(); }

function newGame(){
  G = { sb:10, bb:20, stack:{me:1000, ai:1000}, handNo:0, log:[], phase:"idle" };
  newHand();
}

function newHand(){
  if(G.stack.me <= 0 || G.stack.ai <= 0){ G.phase = "gameover"; return; }
  G.handNo++;
  G.button = (G.handNo % 2 === 1) ? "me" : "ai";
  var dk = shuffle(deck());
  G.hole = { me:[dk[0],dk[1]], ai:[dk[2],dk[3]] };
  G.rest = dk.slice(4);
  G.board = [];
  G.contrib = { me:0, ai:0 };
  G.bet = { me:0, ai:0 };
  G.acted = { me:false, ai:false };
  G.street = 0;
  G.phase = "acting";
  G.reveal = false;
  G.msg = "";
  G.log = [];
  put(G.button, G.sb);
  put(other(G.button), G.bb);
  pushLog((G.button==="me" ? "내가" : "상대가")+" 딜러입니다. 블라인드 "+G.sb+"/"+G.bb+" 를 깔았습니다.");
  G.turn = G.button;              /* 프리플랍은 딜러가 먼저 */
  step();
}

function put(w, amt){
  amt = Math.max(0, Math.min(amt, G.stack[w]));
  G.stack[w] -= amt; G.bet[w] += amt; G.contrib[w] += amt;
  return amt;
}

/* 다음 행동할 사람을 찾아 진행. 사람 차례가 오면 멈춘다 */
function anyAllIn(){ return isAllIn("me") || isAllIn("ai"); }

function step(){
  var guard = 0;
  while(G.phase === "acting" && guard++ < 80){
    /* 둘 다 한 번씩 행동했고 액수가 같거나, 누군가 올인이면 그 라운드는 끝 */
    if(G.acted.me && G.acted.ai && (G.bet.me === G.bet.ai || anyAllIn())){ nextStreet(); continue; }
    var w = G.turn;
    if(isAllIn(w)){ G.acted[w] = true; G.turn = other(w); continue; }
    if(w === "ai"){ aiAct(); continue; }
    return;
  }
  /* 혹시라도 빠져나오지 못하면 판을 정리한다 */
  if(G.phase === "acting") runOut();
}

function nextStreet(){
  G.bet = { me:0, ai:0 };
  if(isAllIn("me") || isAllIn("ai")){ runOut(); return; }
  if(G.street >= 3){ showdown(); return; }
  G.street++;
  var n = (G.street === 1) ? 3 : 1;
  for(var i=0;i<n;i++) G.board.push(G.rest.shift());
  G.acted = { me:false, ai:false };
  G.turn = other(G.button);       /* 플랍부터는 딜러가 나중 */
  pushLog(STREET_NAMES[G.street]+" — "+G.board.map(txt).join(" "));
}

function runOut(){
  while(G.board.length < 5) G.board.push(G.rest.shift());
  pushLog("둘 중 하나가 올인이라 남은 카드를 모두 엽니다.");
  showdown();
}

function settleExcess(){
  var main = 2 * Math.min(G.contrib.me, G.contrib.ai);
  var back = potTotal() - main;
  if(back > 0){
    if(G.contrib.me > G.contrib.ai) G.stack.me += back; else G.stack.ai += back;
  }
  return main;
}

function showdown(){
  G.reveal = true;
  var mine = bestOfSeven(G.hole.me.concat(G.board));
  var yours = bestOfSeven(G.hole.ai.concat(G.board));
  var c = cmp(mine, yours);
  var main = settleExcess();
  var line = "내 손 "+nameOf(mine)+" · 상대 "+nameOf(yours)+". ";
  if(c > 0){ G.stack.me += main; G.msg = line+"내가 "+money(main)+" 을 가져갑니다."; G.win = "me"; }
  else if(c < 0){ G.stack.ai += main; G.msg = line+"상대가 "+money(main)+" 을 가져갑니다."; G.win = "ai"; }
  else {
    var half = Math.floor(main/2);
    G.stack.me += half; G.stack.ai += main - half;
    G.msg = line+"비겨서 나눠 갖습니다."; G.win = null;
  }
  G.best = { me:new Set(mine.map(cid)), ai:new Set(yours.map(cid)) };
  G.phase = "over";
}

function doFold(w){
  var win = other(w);
  G.stack[win] += potTotal();
  G.msg = (w === "me")
    ? "내가 폴드했습니다. 상대가 "+money(potTotal())+" 을 가져갑니다."
    : "상대가 폴드했습니다. 내가 "+money(potTotal())+" 을 가져갑니다.";
  G.win = win;
  G.best = null;
  G.phase = "over";
}

function raiseAmt(w){
  var c = toCall(w);
  var add = Math.max(G.bb, Math.round((potTotal() + c) * 0.7 / 10) * 10);
  var amt = (G.bet[other(w)] + add) - G.bet[w];
  return Math.min(amt, G.stack[w]);
}

/* ── 상대의 판단 ── */
function preStrength(h){
  var a = h[0].r, b = h[1].r, hi = Math.max(a,b), lo = Math.min(a,b);
  var suited = h[0].s === h[1].s, gap = hi - lo;
  if(a === b) return Math.min(0.97, 0.56 + (a-2)*0.034);
  var v = 0.16 + (hi-2)*0.026 + (lo-2)*0.016;
  if(suited) v += 0.07;
  if(gap === 1) v += 0.05; else if(gap === 2) v += 0.02; else if(gap >= 5) v -= 0.05;
  return Math.max(0.05, Math.min(0.9, v));
}
function strength(w){
  var h = G.hole[w];
  if(G.board.length === 0) return preStrength(h);
  var five = bestOfSeven(h.concat(G.board));
  var sc = score(five), g = sc[0];
  var base = [0.16,0.40,0.60,0.75,0.83,0.88,0.94,0.98,1,1][g];
  if(g >= 1 && !h.some(function(c){ return c.r === sc[1]; })) base -= 0.14;
  var all = h.concat(G.board), cnt = {};
  all.forEach(function(c){ cnt[c.s] = (cnt[c.s]||0)+1; });
  var fd = false, k;
  for(k in cnt) if(cnt[k] >= 4) fd = true;
  if(fd && g < 5 && G.board.length < 5) base += 0.10;
  return Math.max(0, Math.min(1, base));
}
function aiAct(){
  var c = toCall("ai"), st = strength("ai"), r = Math.random(), a;
  /* 상대(사람)가 이미 올인이면 더 올릴 수 없다 — 콜 아니면 폴드 */
  if(isAllIn("me")){
    if(c === 0){ G.acted.ai = true; pushLog("상대: 체크"); G.turn = "me"; return; }
    var need0 = c / (potTotal() + c);
    if(st > need0 + 0.05){
      a = put("ai", c); G.acted.ai = true;
      pushLog("상대: 콜 "+money(a)); G.turn = "me"; return;
    }
    pushLog("상대: 폴드"); doFold("ai"); return;
  }
  if(c === 0){
    if(st > 0.72 || (st > 0.50 && r < 0.5) || r < 0.10){
      a = raiseAmt("ai"); put("ai", a);
      G.acted.ai = true; G.acted.me = false;
      pushLog("상대: "+(isAllIn("ai") ? "올인" : "벳")+" "+money(a));
    } else {
      G.acted.ai = true;
      pushLog("상대: 체크");
    }
    G.turn = "me"; return;
  }
  var need = c / (potTotal() + c);
  if(st > 0.85 && r < 0.55 && G.stack.ai > c){
    a = raiseAmt("ai"); put("ai", a);
    G.acted.ai = true; G.acted.me = false;
    pushLog("상대: "+(isAllIn("ai") ? "올인" : "레이즈")+" "+money(a));
    G.turn = "me"; return;
  }
  if(st > need + 0.10 || r < 0.07){
    a = put("ai", c);
    G.acted.ai = true;
    pushLog("상대: 콜 "+money(a));
    G.turn = "me"; return;
  }
  pushLog("상대: 폴드");
  doFold("ai");
}

function myAct(kind){
  if(G.phase !== "acting" || G.turn !== "me") return;
  var c = toCall("me"), a;
  if(kind === "fold"){ pushLog("나: 폴드"); doFold("me"); }
  else if(kind === "check"){ G.acted.me = true; pushLog("나: 체크"); G.turn = "ai"; }
  else if(kind === "call"){ a = put("me", c); G.acted.me = true; pushLog("나: 콜 "+money(a)); G.turn = "ai"; }
  else {
    if(isAllIn("ai")){          /* 상대가 올인이면 콜 이상은 의미가 없다 */
      a = put("me", Math.min(c, G.stack.me));
      G.acted.me = true; pushLog("나: 콜 "+money(a)); G.turn = "ai"; step(); return;
    }
    a = (kind === "allin") ? put("me", G.stack.me) : put("me", raiseAmt("me"));
    G.acted.me = true; G.acted.ai = false;
    pushLog("나: "+(isAllIn("me") ? "올인" : (c > 0 ? "레이즈 " : "벳 "))+money(a));
    G.turn = "ai";
  }
  step();
}

var ALL_GENS = STAGES.map(function(s){ return s.gen; });
var CHAPTERS = [
  { t:"1장 · 짝의 세계",       sub:"카드 한 장부터 짝까지", from:0,  to:7  },
  { t:"2장 · 다섯 장의 모양",  sub:"스트레이트부터 포카드까지", from:7,  to:14 },
  { t:"3장 · 한 판 굴리기",    sub:"순서, 행동, 그리고 판단", from:14, to:19 }
];
function chapterOf(i){
  for(var c=0;c<CHAPTERS.length;c++) if(i>=CHAPTERS[c].from && i<CHAPTERS[c].to) return c;
  return CHAPTERS.length-1;
}

/* ═══════════  상태  ═══════════ */
/* 어느 단계를 끝냈는지 기록. 예전 버전(개수만 저장)에서 넘어온 값도 받아 준다 */
function loadDone(){
  var raw = store.get("cp_done"), set = new Set(), i;
  if(raw !== null && raw !== undefined){
    raw.split(",").forEach(function(v){ if(v!=="") set.add(parseInt(v,10)); });
    return set;
  }
  var old = parseInt(store.get("cp_cleared")||"0",10) || 0;
  for(i=0;i<old && i<14;i++) set.add(i);
  return set;
}
var S = {
  finished: loadDone(),   /* 통과한 단계 목록 */
  openCh: new Set(),      /* 펼쳐 둔 장 */
  bestSpeed: parseInt(store.get("cp_speed")||"0",10) || 0,
  view: "course", i: 0, focus: null,
  q:null, idx:0, chosen:null, right:0, streak:0, best:0, left:60, done:false, speed:false
};
var tick=null, hop=null, deferred=null;

function markDone(i){
  S.finished.add(i);
  store.set("cp_done", Array.from(S.finished).join(","));
}

/* ═══════════  뷰  ═══════════ */
var app = document.getElementById("app");
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function cardHTML(c, size, st){
  var red = (c.s==="h"||c.s==="d");
  return '<div class="card card-'+(size||"md")+' '+(red?"red":"blk")+' '+(st||"")+
    '" role="img" aria-label="'+SUIT_KO[c.s]+" "+LABEL[c.r]+'"><b>'+LABEL[c.r]+'</b><i>'+SUIT_CHAR[c.s]+'</i></div>';
}
function backHTML(size){
  return '<div class="card card-'+(size||"md")+' back" aria-label="아직 열리지 않은 카드"></div>';
}
function handHTML(cards, size, stFn){
  return '<div class="hand">'+cards.map(function(c){
    return cardHTML(c, size, stFn?stFn(c):"");
  }).join("")+'</div>';
}

function courseView(){
  var h = '<div class="screen course"><header class="hero"><div class="hero-cards" aria-hidden="true">'+
    cardHTML({r:5,s:"d"},"sm")+cardHTML({r:13,s:"s"},"sm")+cardHTML({r:13,s:"h"},"sm")+
    '</div><h1>어느 쪽이 셀까?</h1><p>카드 한 장부터 한 판 전체까지. 외우지 말고 계속 맞혀 보세요.</p></header>';

  function node(s, i){
    var done = S.finished.has(i);
    return '<li class="node open'+(done?" done":"")+'" id="node-'+i+'">'+
      '<button data-act="start" data-i="'+i+'">'+
      '<span class="node-no">'+(done?"✓":s.id)+'</span><span class="node-txt"><strong>'+esc(s.title)+
      '</strong><small>'+esc(s.rule)+'</small></span></button></li>';
  }

  CHAPTERS.forEach(function(ch, c){
    var total = ch.to - ch.from, cleared = 0, i;
    for(i=ch.from;i<ch.to;i++) if(S.finished.has(i)) cleared++;
    var open = S.openCh.has(c);

    h += '<button class="ch'+(open?" on":"")+'" data-act="toggle" data-c="'+c+'" aria-expanded="'+open+'">'+
      '<span class="ch-txt"><strong>'+ch.t+'</strong><small>'+ch.sub+'</small></span>'+
      '<span class="ch-cnt">'+cleared+'/'+total+'</span>'+
      '<span class="ch-arw">'+(open?"▾":"▸")+'</span></button>';

    if(open){
      h += '<ol class="track">';
      for(i=ch.from;i<ch.to;i++) h += node(STAGES[i], i);
      h += '</ol>';
    }
  });

  h += '<ol class="track"><li class="node speed open" id="node-'+STAGES.length+'">'+
    '<button data-act="speed"><span class="node-no">⚡</span>'+
    '<span class="node-txt"><strong>스피드 대결</strong><small>'+
    (S.bestSpeed ? "최고 기록 "+S.bestSpeed+"개 · 60초 동안 전 범위에서" : "60초 동안 전 범위에서 몇 개나 맞힐까요")+
    '</small></span></button></li>'+
    '<li class="node duel open"><button data-act="table">'+
    '<span class="node-no">♠</span><span class="node-txt"><strong>실전 대결</strong>'+
    '<small>상대와 1대1로 진짜 한 판. 칩 1,000개로 시작합니다</small>'+
    '</span></button></li></ol>';

  h += '<button class="rulebtn" data-act="rules">📖 규칙 전체 보기</button>';
  h += '<div class="meta"><span>'+STAGES.length+'단계 중 '+S.finished.size+'개 완료</span>'+
       (S.finished.size>0?'<button data-act="reset">진행 초기화</button>':'')+'</div>';
  if(deferred) h += '<button class="install" data-act="install">홈 화면에 추가</button>';
  return h + '</div>';
}

function tableView(){
  if(!G) newGame();
  var over = (G.phase === "over"), gg = (G.phase === "gameover");
  var myTurn = (G.phase === "acting" && G.turn === "me");
  var c = myTurn ? toCall("me") : 0;

  var lit = function(who){
    return function(card){
      if(!G.reveal || !G.best) return "";
      return G.best[who].has(cid(card)) ? "key" : "fade";
    };
  };

  var h = '<div class="screen felt">'+
    '<div class="hud"><button class="x" data-act="home" aria-label="나가기">✕</button>'+
    '<span class="hand-no">'+G.handNo+'번째 판 · '+STREET_NAMES[G.street]+'</span>'+
    '<span class="streak">'+(G.button==="me"?"내 딜러":"상대 딜러")+'</span></div>';

  /* 상대 */
  h += '<div class="seat"><div class="seat-line"><strong>상대</strong>'+
       '<span class="chips">'+money(G.stack.ai)+'</span></div>'+
       '<div class="hand">'+
       (G.reveal ? G.hole.ai.map(function(x){ return cardHTML(x,"md",lit("ai")(x)); }).join("")
                 : backHTML("md")+backHTML("md"))+
       '</div>'+
       (G.bet.ai>0 ? '<span class="betchip">'+money(G.bet.ai)+'</span>' : '')+
       '</div>';

  /* 보드와 팟 */
  h += '<div class="board"><span class="potlbl">팟 <b>'+money(potTotal())+'</b></span><div class="hand">';
  for(var i=0;i<5;i++){
    h += (i < G.board.length)
      ? cardHTML(G.board[i], "md", (G.reveal && G.best && !G.best[G.win==="ai"?"ai":"me"].has(cid(G.board[i]))) ? "fade" : "")
      : backHTML("md");
  }
  h += '</div></div>';

  /* 나 */
  h += '<div class="seat"><div class="seat-line"><strong>나</strong>'+
       '<span class="chips">'+money(G.stack.me)+'</span></div>'+
       '<div class="hand">'+G.hole.me.map(function(x){ return cardHTML(x,"md",lit("me")(x)); }).join("")+'</div>'+
       (G.bet.me>0 ? '<span class="betchip">'+money(G.bet.me)+'</span>' : '')+
       (G.board.length ? '<span class="myhand">지금 내 손 — '+nameOf(bestOfSeven(G.hole.me.concat(G.board)))+'</span>' : '')+
       '</div>';

  /* 진행 기록 */
  h += '<div class="tlog">'+G.log.map(function(l){ return '<span>'+esc(l)+'</span>'; }).join("")+'</div>';

  if(G.msg) h += '<div class="tmsg'+(G.win==="me"?" good":(G.win==="ai"?" bad":""))+'">'+esc(G.msg)+'</div>';

  /* 행동 */
  h += '<div class="acts">';
  if(gg){
    h += '<div class="tmsg '+(G.stack.me>0?"good":"bad")+'">'+
         (G.stack.me>0 ? "상대의 칩을 전부 땄습니다." : "칩이 다 떨어졌습니다.")+'</div>'+
         '<button class="btn wide" data-act="restart">처음부터 다시</button>';
  } else if(over){
    h += '<button class="btn wide" data-act="nexthand">다음 판</button>';
  } else if(myTurn){
    if(c > 0) h += '<button class="act" data-act="tact" data-v="fold">폴드</button>';
    h += (c > 0)
      ? '<button class="act" data-act="tact" data-v="call">콜 '+money(Math.min(c,G.stack.me))+'</button>'
      : '<button class="act" data-act="tact" data-v="check">체크</button>';
    if(!isAllIn("ai")){
      var ra = raiseAmt("me");
      if(G.stack.me > c && ra < G.stack.me)
        h += '<button class="act hot" data-act="tact" data-v="raise">'+(c>0?"레이즈 ":"벳 ")+money(ra)+'</button>';
      h += '<button class="act hot" data-act="tact" data-v="allin">올인 '+money(G.stack.me)+'</button>';
    }
  } else {
    h += '<span class="waiting">상대가 생각 중…</span>';
  }
  h += '</div></div>';
  return h;
}

function introView(){
  var s = STAGES[S.i];
  return '<div class="screen intro"><button class="x solo" data-act="exit" aria-label="나가기">✕</button>'+
    '<span class="eyebrow">'+s.id+'단계</span><h2>'+esc(s.title)+'</h2>'+
    '<p class="rule">'+esc(s.rule)+'</p><div class="demo">'+
    handHTML(s.demo, s.demo.length>3?"sm":"md")+'<span>'+esc(s.note)+'</span></div>'+
    '<button class="btn wide" data-act="go">문제 '+s.n+'개 풀기</button></div>';
}

function hudHTML(){
  var s = STAGES[S.i];
  var mid = S.speed
    ? '<span class="timer'+(S.left<=10?" hot":"")+'" id="timer">'+S.left+'초</span>'
    : '<span class="bar"><span class="bar-in" style="width:'+((S.idx/s.n)*100)+'%"></span></span>';
  return '<div class="hud"><button class="x" data-act="exit" aria-label="나가기">✕</button>'+mid+
    '<span class="streak'+(S.streak>=3?" hot":"")+'">'+(S.streak>=3?"🔥 "+S.streak:S.right+"개")+'</span></div>';
}

function feedbackHTML(q){
  if(S.chosen===null || S.chosen===q.answer) return "";
  var head = q.kind==="quiz" ? "정답은 "+(q.labels ? q.labels[q.answer] : GRADE[q.opts[q.answer]])
    : q.answer==="T" ? "비깁니다" : q.answer==="L" ? "왼쪽이 셉니다" : "오른쪽이 셉니다";
  return '<div class="feedback"><strong>'+head+'</strong><p>'+esc(q.why)+'</p>'+
    '<div class="fb-row"><button class="btn ghost sm" data-act="rules">규칙 전체 보기</button>'+
    '<button class="btn" data-act="advance">알겠습니다</button></div></div>';
}

function playView(){
  var q = S.q, h = '<div class="screen play">'+hudHTML();

  if(q.kind==="quiz"){
    var lit = function(c){
      if(S.chosen===null) return "";
      return (q.best && q.best.has(cid(c))) ? "win" : "fade";
    };
    var label = function(i){ return q.labels ? q.labels[i] : GRADE[q.opts[i]]; };
    var count = q.labels ? q.labels.length : q.opts.length;
    var ask = q.ask || (q.hole ? "완성된 모양은?" : "이건 무슨 모양일까요?");

    h += '<p class="ask">'+esc(ask)+'</p><div class="showcase">';
    if(q.hole){
      h += '<span class="lbl">내 카드</span>'+handHTML(q.hole,"md",lit);
      if(q.board || q.backs){
        h += '<span class="lbl mt">공용 카드</span><div class="hand">';
        if(q.board) q.board.forEach(function(c){ h += cardHTML(c,"sm",lit(c)); });
        for(var b=0;b<(q.backs||0);b++) h += backHTML("sm");
        if(!q.board || (!q.board.length && !q.backs)) h += '';
        h += '</div>';
      }
    } else if(q.cards){
      h += handHTML(q.cards,"md");
    }
    h += '</div><div class="opts'+(count===2?" two":"")+'">';
    for(var oi=0; oi<count; oi++){
      var cls = S.chosen===null ? "" : (oi===q.answer ? "win" : (S.chosen===oi ? "bad" : "fade"));
      h += '<button class="opt '+cls+'" '+(S.chosen===null?'data-act="answer" data-v="'+oi+'"':'disabled')+'>'+
           esc(label(oi))+'</button>';
    }
    return h + '</div>' + feedbackHTML(q) + '</div>';
  }

  var many = q.L.length>1;
  var size = many ? (q.L.length>3?"sm":"md") : "lg";
  var st = function(side){
    if(S.chosen===null) return "";
    return q.answer===side ? "win" : (S.chosen===side ? "bad" : "fade");
  };
  var nm = function(hand){ return (S.chosen!==null && many) ? '<span class="side-name">'+nameOf(hand)+'</span>' : ""; };
  var dis = S.chosen===null ? "" : "disabled";

  var kf = function(set){ return function(c){
    return (S.chosen!==null && set && set.has(cid(c))) ? "key" : "";
  }; };
  h += '<p class="ask">어느 쪽이 더 셀까요?</p><div class="arena '+(many?"stack":"duel")+'">'+
    '<button class="side '+st("L")+'" '+(dis||'data-act="answer" data-v="L"')+'>'+handHTML(q.L,size,kf(q.keyL))+nm(q.L)+'</button>'+
    '<span class="vs">VS</span>'+
    '<button class="side '+st("R")+'" '+(dis||'data-act="answer" data-v="R"')+'>'+handHTML(q.R,size,kf(q.keyR))+nm(q.R)+'</button></div>';

  if(S.speed || STAGES[S.i].tie){
    h += '<button class="tie-btn '+st("T")+'" '+(dis||'data-act="answer" data-v="T"')+'>비긴다</button>';
  }
  return h + feedbackHTML(q) + '</div>';
}

function resultView(){
  var s = STAGES[S.i];
  var total = S.speed ? S.idx + (S.chosen!==null?1:0) : s.n;
  var perfect = !S.speed && S.right===s.n;
  var weak = !S.speed && S.right*2 < s.n;
  var mark = perfect ? "★" : weak ? "●" : "◆";
  var head = S.speed ? "시간 종료" : perfect ? "전부 맞혔습니다" : "완료";
  var h = '<div class="screen result'+(perfect?" perfect":"")+'"><div class="result-mark">'+mark+'</div><h2>'+head+'</h2>'+
    '<p class="big-score"><span>'+S.right+'</span> / '+total+'</p>'+
    '<p class="sub">최고 연속 '+S.best+'개</p>';
  if(S.speed && S.right>=S.bestSpeed && S.right>0) h += '<p class="sub warn">새 최고 기록입니다</p>';
  if(weak) h += '<p class="sub warn">한 번 더 하면 확실히 붙습니다.</p>';
  h += '<div class="btn-row"><button class="btn ghost" data-act="exit">코스로</button>'+
       '<button class="btn" data-act="'+(S.speed?"speed":"nextstage")+'">'+(S.speed?"다시 도전":"다음으로")+'</button></div>';
  return h + '</div>';
}

function showScore(){

}

function rulesHTML(){
  var h = '<div class="ovl" data-act="closerules"><div class="sheet" data-act="noop">'+
    '<div class="sheet-top"><h2>손의 세기 순서</h2>'+
    '<button class="x" data-act="closerules" aria-label="닫기">✕</button></div>'+
    '<p class="sheet-lede">위로 갈수록 셉니다. 다섯 장으로 만드는 모양이고, 이보다 센 손은 없습니다.</p>';
  RULEBOOK.forEach(function(r,i){
    h += '<div class="rule-row"><div class="rule-head"><span class="rule-no">'+(9-i)+'</span>'+
      '<strong>'+GRADE[r.g]+'</strong></div>'+
      handHTML(r.cards,"sm")+
      '<p class="rule-what">'+esc(RULEHINT[r.g])+'</p>'+
      '<p class="rule-tie"><b>같은 모양끼리 붙으면</b> '+esc(r.tie)+'</p></div>';
  });
  h += '<p class="sheet-foot">무늬(♠ ♥ ♦ ♣) 사이에는 위아래가 없습니다. 어느 무늬든 세기는 똑같습니다.</p>'+
    '<button class="btn wide" data-act="closerules">닫기</button></div></div>';
  return h;
}

var modal = document.getElementById("modal");
function openRules(){ modal.innerHTML = rulesHTML(); document.body.style.overflow="hidden"; }
function closeRules(){ modal.innerHTML = ""; document.body.style.overflow=""; }

function render(){
  var v = S.view;
  app.innerHTML = v==="course" ? courseView()
    : v==="intro" ? introView()
    : v==="result" ? resultView()
    : v==="table" ? tableView()
    : playView();

  if(v==="result") showScore();

  /* 코스로 돌아올 땐 방금 하던 단계가 보이도록 */
  if(v==="course" && S.focus !== null && S.focus !== undefined){
    var el = document.getElementById("node-"+S.focus);
    S.focus = null;
    if(el){
      el.classList.add("focus");
      try {
        if(el.scrollIntoView) { el.scrollIntoView({ block:"center" }); return; }
      } catch(e){}
      try { window.scrollTo(0, Math.max(0, el.offsetTop - 180)); return; } catch(e){}
    }
  }
  try { window.scrollTo(0,0); } catch(e){}
}

/* ═══════════  진행  ═══════════ */
function stopTimers(){ if(tick){ clearInterval(tick); tick=null; } if(hop){ clearTimeout(hop); hop=null; } }

function newQ(){ return S.speed ? pick(ALL_GENS)() : STAGES[S.i].gen(); }

function startPlay(speed){
  stopTimers();
  S.speed = !!speed; S.idx=0; S.chosen=null; S.right=0; S.streak=0; S.best=0; S.left=60;
  S.q = newQ(); S.view="play"; render();
  if(S.speed){
    tick = setInterval(function(){
      S.left--;
      var el = document.getElementById("timer");
      if(el){ el.textContent = S.left+"초"; if(S.left<=10) el.classList.add("hot"); }
      if(S.left<=0){ stopTimers(); finish(); }
    },1000);
  }
}
function finish(){
  stopTimers();
  if(S.speed && S.right > S.bestSpeed){ S.bestSpeed = S.right; store.set("cp_speed", String(S.right)); }
  S.view="result"; render();
}
function advance(){
  if(!S.speed && S.idx+1 >= STAGES[S.i].n){ finish(); return; }
  S.chosen=null; S.idx++; S.q=newQ(); render();
}
function answer(v){
  if(S.chosen!==null) return;
  var val = S.q.kind==="quiz" ? parseInt(v,10) : v;
  S.chosen = val;
  if(val === S.q.answer){
    S.right++; S.streak++; if(S.streak>S.best) S.best=S.streak;
    render();
    hop = setTimeout(advance, S.speed?400:780);
  } else { S.streak=0; render(); }
}

/* ═══════════  입력  ═══════════ */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]");
  if(!t || t.disabled) return;
  var act = t.getAttribute("data-act");

  if(act==="start"){ S.i = parseInt(t.getAttribute("data-i"),10); S.view="intro"; render(); }
  else if(act==="go"){ startPlay(false); }
  else if(act==="exit"){
    stopTimers();
    S.focus = S.speed ? STAGES.length : S.i;
    if(!S.speed) S.openCh.add(chapterOf(S.i));
    S.view="course"; render();
  }
  else if(act==="answer"){ answer(t.getAttribute("data-v")); }
  else if(act==="advance"){ advance(); }
  else if(act==="nextstage"){
    markDone(S.i);
    S.focus = Math.min(S.i+1, STAGES.length);   /* 다음 단계로 */
    S.openCh.add(chapterOf(S.focus));
    S.view="course"; render();
  }
  else if(act==="speed"){ S.i=0; startPlay(true); }
  else if(act==="reset"){
    if(confirm("완료 표시를 모두 지울까요?")){ S.finished=new Set(); store.set("cp_done",""); store.set("cp_cleared","0"); render(); }
  }
  else if(act==="table"){ S.view="table"; if(!G) newGame(); render(); }
  else if(act==="home"){ S.view="course"; S.focus=null; render(); }
  else if(act==="tact"){ myAct(t.getAttribute("data-v")); render(); }
  else if(act==="nexthand"){ newHand(); render(); }
  else if(act==="restart"){ newGame(); render(); }
  else if(act==="toggle"){
    var c = parseInt(t.getAttribute("data-c"),10);
    if(S.openCh.has(c)) S.openCh["delete"](c); else S.openCh.add(c);
    render();
  }
  else if(act==="rules"){ openRules(); }
  else if(act==="closerules"){ closeRules(); }
  else if(act==="install" && deferred){
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred=null; render(); });
  }
});

window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault(); deferred = e;
  if(S.view==="course") render();
});

if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

(function(){
  var nx = 0;
  while(nx < STAGES.length && S.finished.has(nx)) nx++;
  if(nx >= STAGES.length) nx = STAGES.length - 1;
  S.openCh.add(chapterOf(nx));
  if(S.finished.size > 0) S.focus = nx;
})();
render();
</script>
</body>
